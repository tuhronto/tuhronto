name: profile art

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [make-assets.mjs, .github/workflows/art.yml]

permissions:
  contents: write

concurrency:
  group: art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: draw
        run: node make-assets.mjs out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # the art lives on its own branch, so main's history stays clean
      - name: publish
        run: |
          if git fetch -q origin output 2>/dev/null; then
            mkdir prev && git archive FETCH_HEAD | tar -x -C prev
            diff -rq prev out && { echo "no change"; exit 0; }
          fi
          cd out
          git init -q -b output
          git config user.name tuhronto
          git config user.email 263775824+tuhronto@users.noreply.github.com
          git add -A
          git commit -q -m "art"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
