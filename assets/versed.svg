<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
<defs>
  <clipPath id="vc"><rect width="1200" height="320" rx="26"/></clipPath>
  <filter id="vblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <linearGradient id="vside" x1="0" x2="1"><stop offset=".3" stop-color="#09090b"/><stop offset=".62" stop-color="#09090b" stop-opacity=".2"/><stop offset="1" stop-color="#09090b" stop-opacity="0"/></linearGradient>
  <linearGradient id="vart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0894a"/><stop offset=".5" stop-color="#c2417a"/><stop offset="1" stop-color="#3d3fc4"/></linearGradient>
  <linearGradient id="vfade" x1="0" y1="0" x2="0" y2="1">
    <stop offset=".32" stop-color="#fff" stop-opacity="0"/><stop offset=".44" stop-color="#fff" stop-opacity=".28"/>
    <stop offset=".52" stop-color="#fff" stop-opacity="1"/><stop offset=".6" stop-color="#fff" stop-opacity=".3"/>
    <stop offset=".86" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="vmask"><rect width="1200" height="320" fill="url(#vfade)"/></mask>
  <style>
    .rise{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .scroll{animation:scroll 10.4s cubic-bezier(.55,0,.25,1) infinite}
   @keyframes scroll{0.00%{transform:translateY(0px)}19.50%{transform:translateY(0px)}25.00%{transform:translateY(-48px)}44.50%{transform:translateY(-48px)}50.00%{transform:translateY(-96px)}69.50%{transform:translateY(-96px)}75.00%{transform:translateY(-144px)}94.50%{transform:translateY(-144px)}100.00%{transform:translateY(-192px)}}
   .bar{transform-box:fill-box;transform-origin:50% 0;animation:eq 1.6s ease-in-out infinite}
   @keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.72)}}
   .blob{transform-box:fill-box;transform-origin:center}
   .a{animation:wa 14s ease-in-out infinite}.b{animation:wb 17s ease-in-out infinite}.c{animation:wa 21s ease-in-out infinite reverse}
   @keyframes wa{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,40px)}}
   @keyframes wb{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-50px)}}
  </style>
</defs>
<g clip-path="url(#vc)">
  <rect width="1200" height="320" fill="#09090b"/>
  <g filter="url(#vblur)" opacity=".55">
    <circle class="blob a" cx="880" cy="120" r="150" fill="#c2417a"/>
    <circle class="blob b" cx="1060" cy="250" r="140" fill="#3d3fc4"/>
    <circle class="blob c" cx="700" cy="300" r="110" fill="#e0894a"/>
  </g>
  <rect width="1200" height="320" fill="url(#vside)"/>
  <g >
    <g transform="translate(72,74)"><rect class="bar" style="animation-delay:0.00s" x="0" y="0" width="9" height="64" rx="4.5" fill="#fff"/><rect class="bar" style="animation-delay:0.18s" x="15" y="0" width="9" height="46" rx="4.5" fill="#fff"/><rect class="bar" style="animation-delay:0.36s" x="30" y="0" width="9" height="28" rx="4.5" fill="#fff"/><rect class="bar" style="animation-delay:0.54s" x="45" y="0" width="9" height="46" rx="4.5" fill="#fff"/><rect class="bar" style="animation-delay:0.72s" x="60" y="0" width="9" height="64" rx="4.5" fill="#fff"/></g>
    <text x="72" y="206" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="64" fill="#fafafa" letter-spacing="-2">versed</text>
    <text x="74" y="244" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#a1a1aa">your discord status sings along to what you're playing</text>
    <text x="74" y="282" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" fill="#71717a" letter-spacing="3">WINDOWS · MACOS · LINUX</text>
  </g>
  <g mask="url(#vmask)">
    <g transform="translate(640,174)" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="30" fill="#fff">
      <g class="scroll"><text x="0" y="0">left the porch light on for you</text><text x="0" y="48">the radio keeps humming low</text><text x="0" y="96">we drove until the city blurred</text><text x="0" y="144">and every song was ours to know</text><text x="0" y="192">left the porch light on for you</text><text x="0" y="240">the radio keeps humming low</text><text x="0" y="288">we drove until the city blurred</text><text x="0" y="336">and every song was ours to know</text><text x="0" y="384">left the porch light on for you</text><text x="0" y="432">the radio keeps humming low</text><text x="0" y="480">we drove until the city blurred</text></g>
    </g>
  </g>
  <g transform="translate(640,44)">
    <rect width="34" height="34" rx="7" fill="url(#vart)"/>
    <text x="48" y="15" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">porch light</text>
    <text x="48" y="31" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#a1a1aa">the late drivers</text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="319" rx="26" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>